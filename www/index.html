    if (window.lucide) window.lucide.createIcons();
  }

  document.getElementById('itemsListContainer').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    const itemId = btn.getAttribute('data-id');
    const preset = getCurrentPreset();
    const itemIndex = preset.items.findIndex(i => i.id === itemId);
    if (itemIndex === -1) return;
    const item = preset.items[itemIndex];

    if (action === 'inc-qty') {
      item.quantity = Math.min(500, (Number(item.quantity) || 1) + 1);
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
    } else if (action === 'dec-qty') {
      if (item.quantity > 1) {
        item.quantity -= 1;
        appState.customSliceOrder = null;
        saveStateToStorage();
        refreshAllUI();
      } else {
        showToast('Số lượng tối thiểu là x1', 'info');
      }
    } else if (action === 'toggle-visible') {
      item.visible = !item.visible;
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
    } else if (action === 'delete') {
      preset.items.splice(itemIndex, 1);
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
    }
  });

  document.getElementById('itemsListContainer').addEventListener('change', (e) => {
    const input = e.target.closest('input[data-action]');
    if (!input) return;
    const action = input.getAttribute('data-action');
    const itemId = input.getAttribute('data-id');
    const preset = getCurrentPreset();
    const item = preset.items.find(i => i.id === itemId);
    if (!item) return;

    if (action === 'color') {
      item.color = input.value;
      saveStateToStorage();
      refreshAllUI();
    } else if (action === 'rename') {
      const parsed = parseItemInputSyntax(input.value);
      if (parsed) {
        item.name = parsed.name;
        if (parsed.matchedSyntax) item.quantity = parsed.quantity;
      }
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
    } else if (action === 'input-qty') {
      item.quantity = Math.min(500, Math.max(1, parseInt(input.value, 10) || 1));
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
    }
  });

  // ==========================================================================
  // 10. FORM THÊM NHANH & NHẬP VĂN BẢN HÀNG LOẠT
  // ==========================================================================
  const quickAddInput = document.getElementById('quickAddInput');
  const syntaxPreviewBadge = document.getElementById('syntaxPreviewBadge');

  quickAddInput.addEventListener('input', () => {
    const parsed = parseItemInputSyntax(quickAddInput.value);
    if (parsed && parsed.matchedSyntax) {
      syntaxPreviewBadge.textContent = `x${parsed.quantity}`;
      syntaxPreviewBadge.classList.remove('hidden');
    } else {
      syntaxPreviewBadge.classList.add('hidden');
    }
  });

  document.getElementById('quickAddItemForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = quickAddInput.value.trim();
    if (!raw) return;

    const parsed = parseItemInputSyntax(raw);
    if (!parsed) return;

    const preset = getCurrentPreset();
    const nextColor = WARM_MODERN_PALETTE[preset.items.length % WARM_MODERN_PALETTE.length];

    preset.items.unshift({
      id: 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: parsed.name,
      color: nextColor,
      quantity: parsed.quantity,
      visible: true
    });

    quickAddInput.value = '';
    syntaxPreviewBadge.classList.add('hidden');
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
    showToast(`Đã thêm "${parsed.name}" (x${parsed.quantity})`, 'success');
  });

  const bulkEditContainer = document.getElementById('bulkEditContainer');
  const bulkTextarea = document.getElementById('bulkTextarea');

  document.getElementById('toggleBulkEditBtn').addEventListener('click', () => {
    const isHidden = bulkEditContainer.classList.contains('hidden');
    if (isHidden) {
      const preset = getCurrentPreset();
      bulkTextarea.value = preset.items.map(i => `${i.name} * ${i.quantity}`).join('\n');
      bulkEditContainer.classList.remove('hidden');
    } else {
      bulkEditContainer.classList.add('hidden');
    }
  });

  document.getElementById('cancelBulkBtn').addEventListener('click', () => {
    bulkEditContainer.classList.add('hidden');
  });

  document.getElementById('applyBulkBtn').addEventListener('click', () => {
    const lines = bulkTextarea.value.split(/\r?\n/);
    const preset = getCurrentPreset();
    const newItems = [];

    lines.forEach((line, index) => {
      const parsed = parseItemInputSyntax(line);
      if (parsed) {
        const existing = preset.items.find(i => i.name.toLowerCase() === parsed.name.toLowerCase());
        newItems.push({
          id: existing ? existing.id : ('item_' + Date.now() + '_' + index),
          name: parsed.name,
          color: existing ? existing.color : WARM_MODERN_PALETTE[index % WARM_MODERN_PALETTE.length],
          quantity: parsed.quantity,
          visible: true
        });
      }
    });

    if (newItems.length === 0) return;
    preset.items = newItems;
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
    bulkEditContainer.classList.add('hidden');
    showToast(`Đã lưu ${newItems.length} biến số!`, 'success');
  });

  document.getElementById('showAllItemsBtn').addEventListener('click', () => {
    const preset = getCurrentPreset();
    preset.items.forEach(i => { i.visible = true; });
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
    showToast('Đã hiện tất cả các mục', 'success');
  });

  document.getElementById('resetMultipliersBtn').addEventListener('click', () => {
    const preset = getCurrentPreset();
    preset.items.forEach(i => { i.quantity = 1; });
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
    showToast('Đã đặt lại tất cả về x1', 'info');
  });

  // ==========================================================================
  // 11. CHẾ ĐỘ HIỂN THỊ, TRỘN XEN KẼ & CỠ CHỮ VÒNG QUAY
  // ==========================================================================
  function updateModeButtonsUI() {
    const dupBtn = document.getElementById('modeDuplicateBtn');
    const weightBtn = document.getElementById('modeWeightedBtn');

    if (appState.displayMode === 'duplicate') {
      dupBtn.className = 'flex items-center justify-center gap-1.5 py-2 px-2 rounded-xl text-xs font-bold transition-all btn-warm-primary';
      weightBtn.className = 'flex items-center justify-center gap-1.5 py-2 px-2 rounded-xl text-xs font-bold transition-all opacity-70';
    } else {
      weightBtn.className = 'flex items-center justify-center gap-1.5 py-2 px-2 rounded-xl text-xs font-bold transition-all btn-warm-primary';
      dupBtn.className = 'flex items-center justify-center gap-1.5 py-2 px-2 rounded-xl text-xs font-bold transition-all opacity-70';
    }
  }

  function updateFontSizeBadgeUI() {
    const badge = document.getElementById('fontSizeBadgeText');
    if (!badge) return;
    const labels = {
      normal: 'Chữ: Vừa',
      large: 'Chữ: Lớn',
      xlarge: 'Chữ: Rất lớn'
    };
    badge.textContent = labels[appState.fontScaleMode] || 'Chữ: Lớn';
  }

  document.getElementById('fontSizeCycleBtn').addEventListener('click', () => {
    const order = ['normal', 'large', 'xlarge'];
    const nextIdx = (order.indexOf(appState.fontScaleMode) + 1) % order.length;
    appState.fontScaleMode = order[nextIdx];
    saveStateToStorage();
    updateFontSizeBadgeUI();
    drawWheelFrame();
  });

  document.getElementById('modeDuplicateBtn').addEventListener('click', () => {
    if (appState.displayMode === 'duplicate') return;
    appState.displayMode = 'duplicate';
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
  });

  document.getElementById('modeWeightedBtn').addEventListener('click', () => {
    if (appState.displayMode === 'weighted') return;
    appState.displayMode = 'weighted';
    saveStateToStorage();
    refreshAllUI();
  });

  document.getElementById('interleaveBtn').addEventListener('click', () => {
    if (isSpinning) return;
    const activeItems = getActiveItems();
    if (activeItems.length <= 1) return;

    if (appState.displayMode === 'weighted') {
      const preset = getCurrentPreset();
      const sorted = [...preset.items].sort((a, b) => b.quantity - a.quantity);
      const interleaved = [];
      let left = 0, right = sorted.length - 1;
      while (left <= right) {
        if (left === right) interleaved.push(sorted[left]);
        else interleaved.push(sorted[left], sorted[right]);
        left++;
        right--;
      }
      preset.items = interleaved;
      saveStateToStorage();
      refreshAllUI();
      showToast('Đã xếp xen kẽ các ô lớn - nhỏ', 'success');
      return;
    }

    appState.interleaveSeed = (appState.interleaveSeed + 1) % 97;
    const interleavedSlices = generateInterleavedDuplicateSlices(activeItems, appState.interleaveSeed);
    appState.customSliceOrder = interleavedSlices.map(i => i.id);
    rebuildWheelSlices();
    drawWheelFrame();
    showToast('Đã trộn xen kẽ đều các ô!', 'success');
  });

  document.getElementById('randomShuffleBtn').addEventListener('click', () => {
    if (isSpinning) return;
    rebuildWheelSlices();
    if (wheelSlices.length <= 1) return;

    if (appState.displayMode === 'weighted') {
      const preset = getCurrentPreset();
      for (let i = preset.items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [preset.items[i], preset.items[j]] = [preset.items[j], preset.items[i]];
      }
      saveStateToStorage();
      refreshAllUI();
    } else {
      const ids = wheelSlices.map(s => s.itemId);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      appState.customSliceOrder = ids;
      rebuildWheelSlices();
      drawWheelFrame();
    }
    showToast('Đã xáo trộn ngẫu nhiên!', 'info');
  });

  // ==========================================================================
  // 12. QUẢN LÝ BỘ LƯU (PRESETS) & LỊCH SỬ
  // ==========================================================================
  function renderPresetsUI() {
    const currentPreset = getCurrentPreset();
    const quickSelect = document.getElementById('quickPresetSelect');
    const badgeEl = document.getElementById('currentPresetBadge');
    const listContainer = document.getElementById('presetsListContainer');

    if (badgeEl) badgeEl.textContent = currentPreset.name;

    quickSelect.innerHTML = appState.presets
      .map(p => `<option value="${p.id}" class="bg-stone-900 text-stone-100" ${p.id === currentPreset.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`)
      .join('');

    listContainer.innerHTML = '';
    appState.presets.forEach((preset) => {
      const isActive = preset.id === currentPreset.id;
      const totalMultipliers = preset.items.reduce((acc, i) => acc + (Number(i.quantity) || 1), 0);

      const card = document.createElement('div');
      card.className = `glass-subcard rounded-2xl p-3 ${
        isActive ? 'border-amber-500/60 ring-1 ring-amber-500/30' : ''
      }`;

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <h4 class="text-xs font-extrabold truncate">${escapeHtml(preset.name)}</h4>
            <p class="text-[10px] opacity-65 mt-0.5">
              ${preset.items.length} mục • Tổng hệ số: <b>${totalMultipliers} ô</b>
            </p>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            ${
              !isActive
                ? `<button type="button" data-preset-action="select" data-id="${preset.id}" class="btn-warm-primary text-[11px] font-bold px-2.5 py-1.5 rounded-xl">
                    Chọn
                  </button>`
                : `<span class="px-2 py-1 rounded-xl text-[10px] font-bold bg-amber-500/20 text-amber-300">
                    Đang dùng
                  </span>`
            }
            <button type="button" data-preset-action="rename" data-id="${preset.id}" class="p-1.5 rounded-xl glass-subcard">
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" data-preset-action="delete" data-id="${preset.id}" class="p-1.5 rounded-xl glass-subcard text-rose-400">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      `;
      listContainer.appendChild(card);
    });

    if (window.lucide) window.lucide.createIcons();
  }

  document.getElementById('quickPresetSelect').addEventListener('change', (e) => {
    appState.currentPresetId = e.target.value;
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
  });

  document.getElementById('createPresetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('newPresetNameInput');
    const name = input.value.trim();
    if (!name) return;

    const newPreset = {
      id: 'preset_' + Date.now(),
      name: name,
      updatedAt: Date.now(),
      items: [
        { id: 'item_' + Date.now() + '_1', name: 'Mục A', color: '#c25e4a', quantity: 1, visible: true },
        { id: 'item_' + Date.now() + '_2', name: 'Mục B', color: '#d48c46', quantity: 2, visible: true },
        { id: 'item_' + Date.now() + '_3', name: 'Mục C', color: '#4a7c6f', quantity: 3, visible: true }
      ]
    };

    appState.presets.unshift(newPreset);
    appState.currentPresetId = newPreset.id;
    appState.customSliceOrder = null;
    input.value = '';
    saveStateToStorage();
    refreshAllUI();
    showToast(`Đã tạo bộ "${name}"`, 'success');
  });

  document.getElementById('duplicateCurrentPresetBtn').addEventListener('click', () => {
    const current = getCurrentPreset();
    const copy = {
      id: 'preset_' + Date.now(),
      name: `${current.name} (Bản sao)`,
      updatedAt: Date.now(),
      items: current.items.map((item, idx) => ({ ...item, id: 'item_' + Date.now() + '_' + idx }))
    };
    appState.presets.unshift(copy);
    appState.currentPresetId = copy.id;
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
    showToast('Đã nhân bản bộ vòng quay', 'success');
  });

  document.getElementById('restoreDefaultPresetsBtn').addEventListener('click', () => {
    const defaults = createDefaultPresets();
    defaults.forEach(def => {
      const idx = appState.presets.findIndex(p => p.id === def.id);
      if (idx !== -1) appState.presets[idx] = def;
      else appState.presets.push(def);
    });
    appState.currentPresetId = defaults[0].id;
    appState.customSliceOrder = null;
    saveStateToStorage();
    refreshAllUI();
    showToast('Đã khôi phục 2 bộ mẫu!', 'success');
  });

  document.getElementById('presetsListContainer').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-preset-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-preset-action');
    const id = btn.getAttribute('data-id');
    const idx = appState.presets.findIndex(p => p.id === id);
    if (idx === -1) return;
    const targetPreset = appState.presets[idx];

    if (action === 'select') {
      appState.currentPresetId = id;
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
      switchMobileTab('wheel');
    } else if (action === 'rename') {
      const newName = window.prompt('Nhập tên mới:', targetPreset.name);
      if (newName && newName.trim()) {
        targetPreset.name = newName.trim();
        saveStateToStorage();
        refreshAllUI();
      }
    } else if (action === 'delete') {
      if (appState.presets.length <= 1) {
        showToast('Cần giữ ít nhất 1 bộ vòng quay!', 'warning');
        return;
      }
      appState.presets.splice(idx, 1);
      if (appState.currentPresetId === id) appState.currentPresetId = appState.presets[0].id;
      appState.customSliceOrder = null;
      saveStateToStorage();
      refreshAllUI();
    }
  });

  function renderHistoryAndStats() {
    const statsContainer = document.getElementById('statsLeaderboardContainer');
    const timelineContainer = document.getElementById('historyTimelineContainer');
    const totalSpins = appState.history.length;
    document.getElementById('totalSpinsStat').textContent = totalSpins;

    if (totalSpins === 0) {
      statsContainer.innerHTML = `<p class="text-xs opacity-60 text-center py-2">Chưa có dữ liệu thống kê.</p>`;
      timelineContainer.innerHTML = `<p class="text-xs opacity-60 text-center py-4">Chưa có lịch sử quay.</p>`;
      return;
    }

    const freqMap = new Map();
    appState.history.forEach((entry) => {
      if (!freqMap.has(entry.name)) {
        freqMap.set(entry.name, { name: entry.name, color: entry.color, count: 0 });
      }
      freqMap.get(entry.name).count += 1;
    });

    const sortedStats = Array.from(freqMap.values()).sort((a, b) => b.count - a.count);
    statsContainer.innerHTML = sortedStats
      .map((stat) => {
        const ratio = ((stat.count / totalSpins) * 100).toFixed(1);
        return `
          <div class="space-y-1">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5 truncate pr-2">
                <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${stat.color}"></span>
                <span class="font-bold truncate">${escapeHtml(stat.name)}</span>
              </div>
              <span class="font-extrabold text-[11px] text-amber-400">${stat.count} lần (${ratio}%)</span>
            </div>
            <div class="w-full h-1.5 bg-stone-800/60 rounded-full overflow-hidden">
              <div class="h-full rounded-full" style="width:${ratio}%; background:${stat.color}"></div>
            </div>
          </div>
        `;
      })
      .join('');

    timelineContainer.innerHTML = appState.history
      .map((entry, idx) => {
        const spinNumber = totalSpins - idx;
        const d = new Date(entry.timestamp);
        const timeStr = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `
          <div class="glass-subcard rounded-xl p-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">#${spinNumber}</span>
              <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${entry.color}"></span>
              <div class="min-w-0">
                <p class="text-xs font-bold truncate">${escapeHtml(entry.name)}</p>
                <p class="text-[10px] opacity-60 truncate">Hệ số lúc trúng: x${entry.quantityAtSpin}</p>
              </div>
            </div>
            <span class="text-[11px] font-bold text-amber-400 flex-shrink-0">${timeStr}</span>
          </div>
        `;
      })
      .join('');
  }

  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    appState.history = [];
    saveStateToStorage();
    renderHistoryAndStats();
    updateCountersUI();
    showToast('Đã xóa lịch sử', 'info');
  });

  // ==========================================================================
  // 13. ĐIỀU HƯỚNG BOTTOM BAR & CHẾ ĐỘ SÁNG/TỐI TRẦM ẤM
  // ==========================================================================
  const tabButtons = document.querySelectorAll('.studio-tab-btn');
  const tabPanels = {
    wheel: document.getElementById('tabPanel-wheel'),
    items: document.getElementById('tabPanel-items'),
    presets: document.getElementById('tabPanel-presets'),
    history: document.getElementById('tabPanel-history')
  };

  function switchMobileTab(targetTab) {
    tabButtons.forEach((b) => {
      const isMatch = b.getAttribute('data-tab') === targetTab;
      if (isMatch) {
        b.className = 'studio-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-2xl text-[11px] font-bold transition-all btn-warm-primary';
      } else {
        b.className = 'studio-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-2xl text-[11px] font-semibold transition-all opacity-65 hover:opacity-100';
      }
    });

    Object.keys(tabPanels).forEach((key) => {
      if (key === targetTab) {
        tabPanels[key].classList.remove('hidden');
        tabPanels[key].classList.add('flex');
      } else {
        tabPanels[key].classList.add('hidden');
        tabPanels[key].classList.remove('flex');
      }
    });

    if (targetTab === 'wheel') {
      requestAnimationFrame(resizeAndDrawWheel);
    }
  }

  tabButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      switchMobileTab(btn.getAttribute('data-tab'));
    });
  });

  document.getElementById('goToItemsQuickBtn').addEventListener('click', () => {
    switchMobileTab('items');
  });

  function applyThemeUI() {
    const body = document.body;
    const themeBtn = document.getElementById('themeToggleBtn');

    if (appState.theme === 'light') {
      body.classList.remove('dark-theme');
      body.classList.add('light-theme');
      document.documentElement.classList.remove('dark');
      if (themeBtn) {
        themeBtn.innerHTML = `<i data-lucide="moon" class="w-4 h-4 text-amber-700"></i>`;
      }
    } else {
      body.classList.remove('light-theme');
      body.classList.add('dark-theme');
      document.documentElement.classList.add('dark');
      if (themeBtn) {
        themeBtn.innerHTML = `<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>`;
      }
    }
    if (window.lucide) window.lucide.createIcons();
    drawWheelFrame();
  }

  function applySoundUI() {
    const soundBtn = document.getElementById('soundToggleBtn');
    if (soundBtn) {
      soundBtn.innerHTML = appState.soundEnabled
        ? `<i data-lucide="volume-2" class="w-4 h-4 text-amber-400"></i>`
        : `<i data-lucide="volume-x" class="w-4 h-4 text-stone-400"></i>`;
    }
    if (window.lucide) window.lucide.createIcons();
  }

  document.getElementById('themeToggleBtn').addEventListener('click', () => {
    appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
    saveStateToStorage();
    applyThemeUI();
  });

  document.getElementById('soundToggleBtn').addEventListener('click', () => {
    appState.soundEnabled = !appState.soundEnabled;
    saveStateToStorage();
    applySoundUI();
    if (appState.soundEnabled) playTickSound(0.7);
  });

  function updateCountersUI() {
    const preset = getCurrentPreset();
    const activeItems = getActiveItems();
    const totalWeight = getTotalWeight(activeItems);

    document.getElementById('activeItemsCountBadge').textContent = `${activeItems.length} mục`;
    document.getElementById('totalSlicesCountBadge').textContent =
      appState.displayMode === 'duplicate' ? `${totalWeight} ô quay` : `Tổng x${totalWeight}`;

    document.getElementById('tabItemsCount').textContent = preset.items.length;
    document.getElementById('tabPresetsCount').textContent = appState.presets.length;
    document.getElementById('tabHistoryCount').textContent = appState.history.length;
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const borderColors = {
      success: 'border-emerald-500/40 text-emerald-300',
      warning: 'border-amber-500/40 text-amber-300',
      info: 'border-amber-500/30 text-stone-200'
    };
    toast.className = `glass-card px-3.5 py-2 rounded-2xl text-xs font-bold border shadow-lg transition-all duration-300 text-center ${
      borderColors[type] || borderColors.info
    }`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 250);
    }, 2000);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function refreshAllUI() {
    rebuildWheelSlices();
    updateSpinDurationUI();
    updateModeButtonsUI();
    updateFontSizeBadgeUI();
    updateCountersUI();
    renderItemsList();
    renderPresetsUI();
    renderHistoryAndStats();
    drawWheelFrame();
  }

  document.getElementById('spinBtn').addEventListener('click', startSpin);
  canvas.addEventListener('click', () => {
    if (!isSpinning) startSpin();
  });

  window.addEventListener('resize', resizeAndDrawWheel);

  // ==========================================================================
  // 14. KHỞI CHẠY ỨNG DỤNG
  // ==========================================================================
  loadStateFromStorage();
  applyThemeUI();
  applySoundUI();
  refreshAllUI();
  resizeAndDrawWheel();
})();

</script>
</body>
</html>
