<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vòng Quay" />
  <link rel="manifest" href="manifest.json" />

  <title>Lucky Wheel Studio</title>

  <!-- Google Fonts: Be Vietnam Pro & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark-theme">

  <!-- KHUNG ỨNG DỤNG ĐIỆN THOẠI (WARM MODERN MOBILE SHELL) -->
  <div class="mobile-app-shell">

    <!-- 1. TOP APP BAR -->
    <header class="glass-card border-t-0 border-x-0 px-4 py-2.5 flex items-center justify-between gap-2 z-30 flex-shrink-0" style="padding-top: max(10px, env(safe-area-inset-top));">
      <!-- App Title & Current Preset Quick Select -->
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <div class="w-8 h-8 rounded-xl btn-warm-primary flex items-center justify-center flex-shrink-0">
          <i data-lucide="compass" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0 flex-1">
          <div class="relative flex items-center">
            <select id="quickPresetSelect" aria-label="Chọn bộ vòng quay" class="bg-transparent font-bold text-xs sm:text-sm pr-5 py-0.5 appearance-none cursor-pointer truncate w-full focus:outline-none">
            </select>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 absolute right-0.5 pointer-events-none opacity-55"></i>
          </div>
          <p class="text-[10px] opacity-55 truncate -mt-0.5">
            <span id="activeItemsCountBadge">0 mục</span> • <span id="totalSlicesCountBadge">0 ô quay</span>
          </p>
        </div>
      </div>

      <!-- Top Right Controls: Font Size, Sound, Theme -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <!-- Font Size Cycle Button -->
        <button id="fontSizeCycleBtn" type="button" title="Chỉnh cỡ chữ trên vòng quay" class="glass-subcard px-2.5 py-1.5 rounded-xl flex items-center gap-1 text-[11px] font-bold active:scale-95 transition">
          <i data-lucide="type" class="w-3.5 h-3.5 text-amber-400"></i>
          <span id="fontSizeBadgeText">Chữ: Lớn</span>
        </button>

        <!-- Sound Toggle -->
        <button id="soundToggleBtn" type="button" title="Bật/Tắt Âm Thanh" class="glass-subcard p-2 rounded-xl flex items-center justify-center active:scale-95 transition">
          <i id="soundIcon" data-lucide="volume-2" class="w-4 h-4 text-amber-400"></i>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" type="button" title="Đổi Giao diện Trầm Tối / Kem Ấm" class="glass-subcard p-2 rounded-xl flex items-center justify-center active:scale-95 transition">
          <i id="themeIcon" data-lucide="sun" class="w-4 h-4 text-amber-400"></i>
        </button>
      </div>
    </header>

    <!-- 2. MAIN APP CONTENT (4 MÀN HÌNH TAB) -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar relative">

      <!-- ================= MÀN HÌNH 1: VÒNG QUAY (WHEEL SCREEN) ================= -->
      <section id="tabPanel-wheel" class="studio-tab-panel flex flex-col items-center justify-between min-h-full px-3.5 py-2.5">
        
        <!-- Live Pointer Indicator Pill -->
        <div class="w-full flex items-center justify-center">
          <div class="flex items-center gap-2 px-3.5 py-1 rounded-full glass-subcard">
            <span id="livePointerColorDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 flex-shrink-0"></span>
            <span class="text-[11px] opacity-60">Đang trỏ:</span>
            <span id="livePointerLabel" class="text-xs font-bold truncate max-w-[220px]">
              Sẵn sàng quay
            </span>
          </div>
        </div>

        <!-- WHEEL STAGE (Hiện đại, Trầm ấm, Tinh tế) -->
        <div class="relative my-auto py-2 flex items-center justify-center select-none">
          <!-- Sleek Watch-Style Pointer at 12 o'clock -->
          <div class="wheel-pointer-wrapper">
            <div id="wheelPointer" class="wheel-pointer">
              <svg width="36" height="44" viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 41L6.5 14.5C4.5 9.8 7.9 4 13.1 4H22.9C28.1 4 31.5 9.8 29.5 14.5L18 41Z" fill="#292524" stroke="#e09f5a" stroke-width="2.5" stroke-linejoin="round"/>
                <circle cx="18" cy="13" r="4" fill="#e09f5a"/>
              </svg>
            </div>
          </div>

          <!-- High-DPI HTML5 Canvas -->
          <div id="canvasContainer" class="relative z-10 flex items-center justify-center">
            <canvas id="wheelCanvas" class="rounded-full"></canvas>

            <!-- Modern Matte Center 'QUAY' Button -->
            <button id="spinBtn" type="button" aria-label="Bắt đầu quay" class="spin-btn-modern">
              <span class="text-[11px] font-extrabold tracking-widest text-amber-400">QUAY</span>
            </button>
          </div>
        </div>

        <!-- Bottom Controls on Wheel Screen -->
        <div class="w-full space-y-2 mt-1">
          
          <!-- Thanh tùy chỉnh Thời gian quay (Spin Duration Control) -->
          <div class="glass-subcard px-3 py-2 rounded-2xl flex items-center justify-between gap-2.5">
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <i data-lucide="timer" class="w-3.5 h-3.5 text-amber-400"></i>
              <span class="text-[11px] font-semibold opacity-80">Thời gian:</span>
              <span id="spinDurationValueText" class="text-xs font-extrabold text-amber-400 min-w-[28px]">5s</span>
            </div>

            <input
              id="spinDurationSlider"
              type="range"
              min="1"
              max="20"
              step="1"
              value="5"
              aria-label="Thời gian quay (giây)"
              class="warm-slider flex-1 cursor-pointer"
            />

            <!-- Quick Duration Chips -->
            <div class="flex items-center gap-1 flex-shrink-0">
              <button type="button" data-dur="3" class="dur-preset-btn px-2 py-0.5 rounded-lg text-[10px] font-bold glass-subcard hover:border-amber-500/40">3s</button>
              <button type="button" data-dur="5" class="dur-preset-btn px-2 py-0.5 rounded-lg text-[10px] font-bold glass-subcard hover:border-amber-500/40">5s</button>
              <button type="button" data-dur="10" class="dur-preset-btn px-2 py-0.5 rounded-lg text-[10px] font-bold glass-subcard hover:border-amber-500/40">10s</button>
            </div>
          </div>

          <!-- 2 Chế độ hiển thị khi nhân số lượng -->
          <div class="grid grid-cols-2 gap-1.5 glass-subcard p-1 rounded-2xl">
            <button id="modeDuplicateBtn" type="button" class="flex items-center justify-center gap-1.5 py-2 px-2 rounded-xl text-xs font-bold transition-all">
              <i data-lucide="grid" class="w-3.5 h-3.5"></i>
              <span>Tách ô (xN)</span>
            </button>
            <button id="modeWeightedBtn" type="button" class="flex items-center justify-center gap-1.5 py-2 px-2 rounded-xl text-xs font-bold transition-all">
              <i data-lucide="pie-chart" class="w-3.5 h-3.5"></i>
              <span>Mở rộng diện tích</span>
            </button>
          </div>

          <!-- Hàng nút: Trộn xen kẽ + Ngẫu nhiên + Mở nhanh Biến số -->
          <div class="flex items-center gap-1.5">
            <button id="interleaveBtn" type="button" class="flex-1 glass-subcard py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 text-amber-300 active:scale-95 transition">
              <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
              <span>Trộn xen kẽ</span>
            </button>
            <button id="randomShuffleBtn" type="button" class="glass-subcard py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
              <i data-lucide="dices" class="w-3.5 h-3.5"></i>
              <span>Ngẫu nhiên</span>
            </button>
            <button id="goToItemsQuickBtn" type="button" class="btn-warm-primary py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
              <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
              <span>Sửa mục</span>
            </button>
          </div>
          <p id="modeDescriptionText" class="hidden"></p>
        </div>

      </section>

      <!-- ================= MÀN HÌNH 2: BIẾN SỐ & NHÂN HỆ SỐ ================= -->
      <section id="tabPanel-items" class="studio-tab-panel hidden flex-col px-3.5 py-3">
        <!-- Quick Add Form with Syntax Support (Tên mục * N or Tên mục xN) -->
        <form id="quickAddItemForm" class="mb-3">
          <div class="flex items-center justify-between text-[11px] font-semibold opacity-75 mb-1.5">
            <span>Cú pháp nhanh: <code class="text-amber-400 font-bold">Tên * N</code> hoặc <code class="text-amber-400 font-bold">Tên xN</code></span>
            <button id="toggleBulkEditBtn" type="button" class="text-amber-400 underline flex items-center gap-1 font-bold">
              <i data-lucide="file-text" class="w-3 h-3"></i>
              <span>Nhập hàng loạt</span>
            </button>
          </div>
          <div class="flex items-center gap-1.5">
            <div class="relative flex-1">
              <input
                id="quickAddInput"
                type="text"
                placeholder="VD: Giải thưởng A * 5 hoặc Voucher x3"
                class="glass-input w-full rounded-xl pl-3 pr-12 py-2.5 text-xs font-medium"
              />
              <span id="syntaxPreviewBadge" class="hidden absolute right-2 top-1/2 -translate-y-1/2 px-1.5 py-0.5 text-[10px] font-extrabold rounded bg-amber-500/20 text-amber-300">
                x1
              </span>
            </div>
            <button type="submit" class="btn-warm-primary font-bold text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-1 flex-shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Thêm</span>
            </button>
          </div>
        </form>

        <!-- Collapsible Bulk Text Area Mode -->
        <div id="bulkEditContainer" class="hidden mb-3 glass-subcard p-3 rounded-2xl border border-amber-500/30">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold text-amber-300">Nhập nhanh nhiều dòng (Mỗi dòng 1 mục)</span>
            <span class="text-[10px] opacity-65"><code>Tên * N</code> / <code>Tên xN</code></span>
          </div>
          <textarea
            id="bulkTextarea"
            rows="5"
            placeholder="Giải Đặc Biệt * 1&#10;Giải Nhất x2&#10;Voucher 500K * 4"
            class="glass-input w-full rounded-xl p-2.5 text-xs font-mono leading-relaxed custom-scrollbar"
          ></textarea>
          <div class="flex items-center justify-end gap-2 mt-2">
            <button id="cancelBulkBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold opacity-75">
              Đóng
            </button>
            <button id="applyBulkBtn" type="button" class="btn-warm-primary px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
              <i data-lucide="check" class="w-3.5 h-3.5"></i>
              <span>Lưu danh sách</span>
            </button>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="flex items-center justify-between gap-2 mb-2 text-[11px]">
          <span class="opacity-70 font-medium">Danh sách (<span id="visibleRatioText">0/0 hiển thị</span>)</span>
          <div class="flex items-center gap-1.5">
            <button id="showAllItemsBtn" type="button" class="glass-subcard px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1">
              <i data-lucide="eye" class="w-3 h-3"></i>
              <span>Hiện tất cả</span>
            </button>
            <button id="resetMultipliersBtn" type="button" class="glass-subcard px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1">
              <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
              <span>Về x1</span>
            </button>
          </div>
        </div>

        <!-- Item Cards List -->
        <div id="itemsListContainer" class="space-y-2 pb-4">
        </div>
      </section>

      <!-- ================= MÀN HÌNH 3: BỘ LƯU (PRESETS) ================= -->
      <section id="tabPanel-presets" class="studio-tab-panel hidden flex-col px-3.5 py-3">
        <div class="glass-subcard p-3 rounded-2xl mb-3">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-bold text-amber-300 flex items-center gap-1.5">
              <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
              <span>Quản lý Bộ Vòng Quay</span>
            </h3>
            <span id="currentPresetBadge" class="text-[10px] font-semibold opacity-70 truncate max-w-[150px]"></span>
          </div>
          <form id="createPresetForm" class="flex items-center gap-1.5">
            <input
              id="newPresetNameInput"
              type="text"
              placeholder="Tên bộ vòng quay mới..."
              class="glass-input flex-1 rounded-xl px-3 py-2 text-xs"
            />
            <button type="submit" class="btn-warm-primary text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 flex-shrink-0">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Tạo</span>
            </button>
          </form>
          <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-white/10 text-[11px]">
            <button id="duplicateCurrentPresetBtn" type="button" class="text-stone-300 font-semibold flex items-center gap-1 hover:text-amber-400">
              <i data-lucide="copy" class="w-3 h-3"></i>
              <span>Nhân bản bộ này</span>
            </button>
            <button id="restoreDefaultPresetsBtn" type="button" class="text-amber-400 font-semibold flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3 h-3"></i>
              <span>Khôi phục 2 bộ mẫu</span>
            </button>
          </div>
        </div>

        <div id="presetsListContainer" class="space-y-2 pb-4">
        </div>
      </section>

      <!-- ================= MÀN HÌNH 4: LỊCH SỬ & THỐNG KÊ ================= -->
      <section id="tabPanel-history" class="studio-tab-panel hidden flex-col px-3.5 py-3">
        <div class="flex items-center justify-between mb-2.5">
          <div class="text-xs font-bold flex items-center gap-1.5">
            <i data-lucide="bar-chart-3" class="w-4 h-4 text-amber-400"></i>
            <span>Thống kê tần suất (<span id="totalSpinsStat">0</span> lượt)</span>
          </div>
          <button id="clearHistoryBtn" type="button" class="glass-subcard px-2.5 py-1 rounded-lg text-[11px] font-semibold text-rose-400 flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3 h-3"></i>
            <span>Xóa lịch sử</span>
          </button>
        </div>

        <div id="statsLeaderboardContainer" class="glass-subcard p-3 rounded-2xl mb-3.5 space-y-2 max-h-[190px] overflow-y-auto custom-scrollbar">
        </div>

        <div class="text-xs font-bold mb-2 flex items-center gap-1.5">
          <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i>
          <span>Nhật ký kết quả chi tiết</span>
        </div>
        <div id="historyTimelineContainer" class="space-y-2 pb-4">
        </div>
      </section>

    </main>

    <!-- 3. BOTTOM NAVIGATION BAR -->
    <nav class="glass-card border-b-0 border-x-0 px-2.5 pt-1.5 pb-2 grid grid-cols-4 gap-1.5 z-30 flex-shrink-0" style="padding-bottom: max(8px, env(safe-area-inset-bottom));">
      <button type="button" data-tab="wheel" class="studio-tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl text-[11px] font-bold transition-all btn-warm-primary">
        <i data-lucide="compass" class="w-4 h-4 mb-0.5"></i>
        <span>Vòng quay</span>
      </button>

      <button type="button" data-tab="items" class="studio-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-2xl text-[11px] font-semibold transition-all opacity-65 hover:opacity-100">
        <i data-lucide="sliders-horizontal" class="w-4 h-4 mb-0.5"></i>
        <span>Biến số</span>
        <span id="tabItemsCount" class="absolute top-1 right-3 px-1.5 text-[9px] font-extrabold rounded-full bg-amber-500/20 text-amber-300">0</span>
      </button>

      <button type="button" data-tab="presets" class="studio-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-2xl text-[11px] font-semibold transition-all opacity-65 hover:opacity-100">
        <i data-lucide="folder-heart" class="w-4 h-4 mb-0.5"></i>
        <span>Bộ lưu</span>
        <span id="tabPresetsCount" class="absolute top-1 right-3 px-1.5 text-[9px] font-extrabold rounded-full bg-amber-500/20 text-amber-300">2</span>
      </button>

      <button type="button" data-tab="history" class="studio-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-2xl text-[11px] font-semibold transition-all opacity-65 hover:opacity-100">
        <i data-lucide="history" class="w-4 h-4 mb-0.5"></i>
        <span>Lịch sử</span>
        <span id="tabHistoryCount" class="absolute top-1 right-3 px-1.5 text-[9px] font-extrabold rounded-full bg-amber-500/20 text-amber-300">0</span>
      </button>
    </nav>

    <!-- ================= WINNER RESULT MODAL ================= -->
    <div id="winnerModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
      <div class="glass-card animate-modal-pop w-full max-w-[360px] rounded-3xl p-5 text-center relative overflow-hidden border border-white/10 shadow-2xl">
        <div id="winnerModalGlow" class="w-32 h-32 rounded-full blur-3xl absolute -top-14 left-1/2 -translate-x-1/2 opacity-20 pointer-events-none bg-amber-500"></div>

        <div class="mx-auto w-12 h-12 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-2.5 relative z-10">
          <i data-lucide="award" class="w-6 h-6 text-amber-400"></i>
        </div>

        <p class="text-[11px] font-bold uppercase tracking-wider opacity-65 mb-1 relative z-10">
          Kết quả vòng quay
        </p>

        <!-- Winner Name Banner -->
        <div id="winnerPrizeCard" class="my-3.5 p-3.5 rounded-2xl glass-subcard border relative z-10">
          <div class="flex items-center justify-center gap-1.5 mb-1">
            <span id="winnerColorDot" class="w-3 h-3 rounded-full"></span>
            <span id="winnerMultiplierBadge" class="text-[11px] font-extrabold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">
              Hệ số: x1
            </span>
            <span id="winnerProbabilityBadge" class="text-[11px] font-semibold opacity-70">
              (0%)
            </span>
          </div>
          <h2 id="winnerNameText" class="text-lg font-extrabold tracking-tight break-words mt-1">
            Giải Thưởng
          </h2>
        </div>

        <!-- 3 Action Buttons -->
        <div class="space-y-2 mt-4 relative z-10">
          <button id="modalKeepBtn" type="button" class="w-full py-2.5 px-4 rounded-xl font-bold text-xs btn-warm-primary flex items-center justify-center gap-1.5">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
            <span>Quay tiếp (Giữ nguyên)</span>
          </button>

          <button id="modalDecreaseOneBtn" type="button" class="w-full py-2.5 px-4 rounded-xl font-bold text-xs glass-subcard text-amber-300 flex items-center justify-center gap-1.5 active:scale-95 transition">
            <i data-lucide="minus-circle" class="w-3.5 h-3.5"></i>
            <span id="modalDecreaseBtnText">Giảm 1 lượt của mục này</span>
          </button>

          <button id="modalRemoveCompletelyBtn" type="button" class="w-full py-2.5 px-4 rounded-xl font-bold text-xs glass-subcard text-rose-400 flex items-center justify-center gap-1.5 active:scale-95 transition">
            <i data-lucide="eye-off" class="w-3.5 h-3.5"></i>
            <span>Loại bỏ hoàn toàn mục này</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastContainer" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-1.5 pointer-events-none w-[90%] max-w-[360px]"></div>

  </div>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
