name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Cordova & Native IR Hardware Bridge APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          npm install -g cordova
          PACKAGE_ID=$(node -pe "JSON.parse(fs.readFileSync('www/app-config.json','utf8')).packageId || 'com.apkfactory.webapp'")
          APP_NAME=$(node -pe "JSON.parse(fs.readFileSync('www/app-config.json','utf8')).appName || 'MyWebApp'")
          cordova create build_app "$PACKAGE_ID" "$APP_NAME"
          rm -rf build_app/www/*
          cp -r www/* build_app/www/
          if [ -d native ]; then cp -r native build_app/native; fi
          cd build_app
          cat << 'EOF' > pre-config.js
          const fs = require('fs');
          let xml = fs.readFileSync('config.xml', 'utf8');
          let cfg = {};
          try { cfg = JSON.parse(fs.readFileSync('www/app-config.json', 'utf8')); } catch(e) {}
          const orient = cfg.orientation || 'portrait';
          const extra = '<icon src="www/icon.png" /><preference name="Orientation" value="' + orient + '" /><access origin="*" /><allow-navigation href="*" /><allow-intent href="http://*/*" /><allow-intent href="https://*/*" /><preference name="AndroidInsecureFileModeEnabled" value="true" />';
          xml = xml.replace('</widget>', extra + '</widget>');
          fs.writeFileSync('config.xml', xml);
          if (fs.existsSync('www/index.html')) {
            let html = fs.readFileSync('www/index.html', 'utf8');
            html = html.replace(/<meta[^>]+Content-Security-Policy[^>]*>/gi, '');
            fs.writeFileSync('www/index.html', html);
          }
          EOF
          node pre-config.js
          cordova platform add android@13.0.0
          cordova prepare android
          cp -r www/* platforms/android/app/src/main/assets/ || true
          cat << 'EOF' > patch-android.js
          const fs = require('fs');
          const path = require('path');
          let cfg = {};
          try { cfg = JSON.parse(fs.readFileSync('www/app-config.json', 'utf8')); } catch(e) {}
          const pkgId = cfg.packageId || 'com.apkfactory.webapp';
          const javaPkgDir = path.join('platforms/android/app/src/main/java', ...pkgId.split('.'));
          fs.mkdirSync(javaPkgDir, { recursive: true });
          const mainActivityJava = [
            'package ' + pkgId + ';',
            '',
            'import android.content.Context;',
            'import android.hardware.ConsumerIrManager;',
            'import android.os.Build;',
            'import android.os.Bundle;',
            'import android.os.VibrationEffect;',
            'import android.os.Vibrator;',
            'import android.os.VibratorManager;',
            'import android.view.View;',
            'import android.view.WindowManager;',
            'import android.webkit.JavascriptInterface;',
            'import android.webkit.WebSettings;',
            'import android.webkit.WebView;',
            'import org.apache.cordova.*;',
            'import org.json.JSONArray;',
            'import java.util.concurrent.ExecutorService;',
            'import java.util.concurrent.Executors;',
            '',
            'public class MainActivity extends CordovaActivity {',
            '    private ConsumerIrManager irManager;',
            '    private final ExecutorService irExecutor = Executors.newSingleThreadExecutor();',
            '',
            '    @Override',
            '    public void onCreate(Bundle savedInstanceState) {',
            '        super.onCreate(savedInstanceState);',
            '        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);',
            '        try {',
            '            irManager = (ConsumerIrManager) getSystemService(Context.CONSUMER_IR_SERVICE);',
            '        } catch (Exception e) {',
            '            irManager = null;',
            '        }',
            '        Bundle extras = getIntent().getExtras();',
            '        if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {',
            '            moveTaskToBack(true);',
            '        }',
            '        super.init();',
            '        try {',
            '            if (this.appView != null) {',
            '                View engineView = this.appView.getView();',
            '                if (engineView instanceof WebView) {',
            '                    WebView wv = (WebView) engineView;',
            '                    WebSettings ws = wv.getSettings();',
            '                    ws.setJavaScriptEnabled(true);',
            '                    ws.setDomStorageEnabled(true);',
            '                    ws.setDatabaseEnabled(true);',
            '                    ws.setMediaPlaybackRequiresUserGesture(false);',
            '                    ws.setTextZoom(100);',
            '                    wv.addJavascriptInterface(new AndroidIRBridge(this, irManager), "AndroidIR");',
            '                }',
            '            }',
            '        } catch (Exception e) {',
            '            e.printStackTrace();',
            '        }',
            '        loadUrl(launchUrl);',
            '    }',
            '',
            '    public class AndroidIRBridge {',
            '        private final Context context;',
            '        private final ConsumerIrManager consumerIr;',
            '        public AndroidIRBridge(Context ctx, ConsumerIrManager ir) {',
            '            this.context = ctx;',
            '            this.consumerIr = ir;',
            '        }',
            '        @JavascriptInterface',
            '        public boolean hasIrEmitter() {',
            '            try {',
            '                return consumerIr != null && consumerIr.hasIrEmitter();',
            '            } catch (Exception e) {',
            '                return false;',
            '            }',
            '        }',
            '        @JavascriptInterface',
            '        public boolean transmit(int carrierFrequency, String patternJson) {',
            '            if (consumerIr == null) return false;',
            '            try {',
            '                if (!consumerIr.hasIrEmitter()) return false;',
            '                JSONArray jsonArray = new JSONArray(patternJson);',
            '                int len = jsonArray.length();',
            '                if (len == 0) return false;',
            '                final int[] pattern = new int[len];',
            '                for (int i = 0; i < len; i++) {',
            '                    int us = jsonArray.optInt(i, 500);',
            '                    pattern[i] = us > 0 ? us : 500;',
            '                }',
            '                final int safeFreq = (carrierFrequency >= 25000 && carrierFrequency <= 60000) ? carrierFrequency : 38000;',
            '                irExecutor.execute(new Runnable() {',
            '                    @Override',
            '                    public void run() {',
            '                        try {',
            '                            consumerIr.transmit(safeFreq, pattern);',
            '                            Thread.sleep(50);',
            '                        } catch (Exception e) {',
            '                            e.printStackTrace();',
            '                        }',
            '                    }',
            '                });',
            '                return true;',
            '            } catch (Exception e) {',
            '                e.printStackTrace();',
            '                return false;',
            '            }',
            '        }',
            '        @JavascriptInterface',
            '        public void vibrate(long durationMs) {',
            '            try {',
            '                long ms = durationMs > 0 ? durationMs : 30;',
            '                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {',
            '                    VibratorManager vm = (VibratorManager) context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE);',
            '                    if (vm != null) {',
            '                        vm.getDefaultVibrator().vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));',
            '                    }',
            '                } else {',
            '                    Vibrator v = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);',
            '                    if (v != null) {',
            '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {',
            '                            v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));',
            '                        } else {',
            '                            v.vibrate(ms);',
            '                        }',
            '                    }',
            '                }',
            '            } catch (Exception ignored) {}',
            '        }',
            '    }',
            '',
            '    @Override',
            '    public void onDestroy() {',
            '        irExecutor.shutdownNow();',
            '        super.onDestroy();',
            '    }',
            '}'
          ].join('\n');
          fs.writeFileSync(path.join(javaPkgDir, 'MainActivity.java'), mainActivityJava, 'utf8');
          const mfPath = 'platforms/android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(mfPath)) {
            let mf = fs.readFileSync(mfPath, 'utf8');
            if (!mf.includes('usesCleartextTraffic')) {
              mf = mf.replace('<application', '<application android:usesCleartextTraffic="true"');
            }
            const defaultPerms = [
              '<uses-permission android:name="android.permission.TRANSMIT_IR" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-feature android:name="android.hardware.consumerir" android:required="false" />'
            ];
            if (fs.existsSync('native/AndroidManifest.xml')) {
              const userMf = fs.readFileSync('native/AndroidManifest.xml', 'utf8');
              const permRegex = /<uses-(?:permission|feature)\b[^>]*?\/?>/gi;
              let m;
              while ((m = permRegex.exec(userMf)) !== null) {
                const t = m[0].endsWith('/>') ? m[0] : m[0].replace(/>$/, ' />');
                defaultPerms.push(t);
              }
            }
            const toInject = [];
            const seen = new Set();
            for (const tag of defaultPerms) {
              const nm = tag.match(/android:name="([^"]+)"/);
              if (nm && !seen.has(nm[1]) && !mf.includes(nm[1])) {
                seen.add(nm[1]);
                toInject.push(tag);
              }
            }
            if (toInject.length > 0) {
              mf = mf.replace('<application', toInject.join('\n    ') + '\n    <application');
            }
            fs.writeFileSync(mfPath, mf, 'utf8');
          }
          EOF
          node patch-android.js
          cordova compile android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../app-release.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG_NAME" app-release.apk --title "APK Release $TAG_NAME" --notes "Auto-built APK" --latest