name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My Web App'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.antigravity.webapp'
      orientation:
        description: 'Orientation'
        required: true
        default: 'portrait'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create build_app "${{ github.event.inputs.package_id }}" "${{ github.event.inputs.app_name }}"
          cp -r www/* build_app/www/
          cd build_app
          # Cấu hình icon, hướng màn hình và cho phép tải CDN mạng ngoài
          sed -i 's|</widget>|  <preference name="Orientation" value="${{ github.event.inputs.orientation }}" />\n  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/icon.png" />\n  <icon src="www/icon.png" />\n  <allow-navigation href="*" />\n  <access origin="*" />\n</widget>|g' config.xml
          cordova platform add android
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../app-release.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG_NAME" app-release.apk --title "${{ github.event.inputs.app_name }} ($TAG_NAME)" --notes "Auto-built APK from HTML" --latest
